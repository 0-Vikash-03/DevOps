<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4b79a1, #283e51);
      color: #333;
    }
    .container {
      width: 360px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .header {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 24px 20px;
    }
    .header h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      opacity: 0.85;
    }
    .tab-switch {
      display: flex;
    }
    .tab-switch button {
      flex: 1;
      border: none;
      background: #ecf0f1;
      padding: 14px 0;
      font-weight: 600;
      cursor: pointer;
      color: #2c3e50;
      transition: background 0.2s ease;
    }
    .tab-switch button.active {
      background: #fff;
      border-bottom: 3px solid #3498db;
    }
    .form-panel {
      padding: 24px 30px 30px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #444;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd1d9;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input:focus {
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3498db;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button[type="submit"]:hover {
      background: #2980b9;
    }
    .toggle-text {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
    .toggle-text a {
      color: #3498db;
      text-decoration: none;
      cursor: pointer;
    }
    .message {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #27ae60;
      display: none;
    }
    .error {
      color: #c0392b;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Welcome</h1>
      <p>Use the form below to log in or register.</p>
    </div>
    <div class="tab-switch">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
    <div class="form-panel">
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <button type="submit">Login</button>
        <p class="toggle-text">Don't have an account? <a id="showRegister">Register</a></p>
      </form>

      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create a password" required>
        </div>
        <div class="form-group">
          <label for="registerConfirm">Confirm Password</label>
          <input type="password" id="registerConfirm" placeholder="Confirm your password" required>
        </div>
        <button type="submit">Register</button>
        <p class="toggle-text">Already have an account? <a id="showLogin">Login</a></p>
      </form>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');
    const messageBox = document.getElementById('message');

    function showForm(form) {
      if (form === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
      }
      messageBox.style.display = 'none';
      messageBox.classList.remove('error');
    }

    loginTab.addEventListener('click', () => showForm('login'));
    registerTab.addEventListener('click', () => showForm('register'));
    showRegister.addEventListener('click', () => showForm('register'));
    showLogin.addEventListener('click', () => showForm('login'));

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!email || !password) {
        showMessage('Please enter your email and password.', true);
        return;
      }
      showMessage('Login successful. Welcome back!');
    });

    registerForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value.trim();
      const confirm = document.getElementById('registerConfirm').value.trim();
      if (!name || !email || !password || !confirm) {
        showMessage('Please fill in all registration fields.', true);
        return;
      }
      if (password !== confirm) {
        showMessage('Passwords do not match.', true);
        return;
      }
      showMessage('Registration successful. You can now log in.');
      registerForm.reset();
      showForm('login');
    });

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.classList.toggle('error', isError);
      messageBox.style.display = 'block';
    }
  </script>
</body>
</html>
